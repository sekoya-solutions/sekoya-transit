name: Balance simulation

# Plays the balance simulation (ADR 0033) on every map size after a merge to main that can change the economy, and
# reports the progression targets of docs/specs/economy-progression.md in the run summary. The targets are guidance
# for balance tuning: a missed target is reported, not a failure; only a crash of the tool fails the run.
on:
  # TEMPORARY (Issue #196): measure the workflow on its pull request branch; removed before merge.
  push:
    branches: [main, ci/196-build-balance-tool]
    paths:
      - "TransportTycoon2/Assets/_Project/Scripts/Core/**"
      - "TransportTycoon2/Assets/_Project/Scripts/Content/**"
      - "TransportTycoon2/Assets/_Project/Content/Data/**"
      - "dotnet/TransportTycoon.Balance/**"
      - "dotnet/Directory.Build.props"
      - ".github/workflows/balance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: balance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    name: Simulate ${{ matrix.size }} map
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        size: [small, medium, large]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build dotnet/TransportTycoon.Balance --configuration Release

      - name: Play seeds 1, 2 and 3 for 20 game years
        run: |
          mkdir -p balance
          dotnet dotnet/TransportTycoon.Balance/bin/Release/net10.0/TransportTycoon.Balance.dll \
            --size "${{ matrix.size }}" --seeds 1,2,3 --years 20 \
            --markdown "balance/${{ matrix.size }}.md" \
            --overview "balance/${{ matrix.size }}-overview.md" \
            | tee "balance/${{ matrix.size }}.txt"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-${{ matrix.size }}
          path: balance/
          if-no-files-found: warn

  recap:
    name: Recap
    needs: simulate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: balance-*
          path: balance
          merge-multiple: true

      - name: Write the run summary
        run: |
          {
            echo "## Balance simulation"
            echo
            echo "Scripted player on the real Core with the shipped content; targets from [economy-progression.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/specs/economy-progression.md). A missed target is reported for tuning, not a failure."
            echo
            printf '| Map | Seeds | Checks passed | Failed | Bankruptcies |\n| --- | --- | --- | --- | --- |\n'
            for size in small medium large; do
              if [ -f "balance/$size-overview.md" ]; then
                cat "balance/$size-overview.md"
              else
                echo "| ${size^} | – | ❌ no result (the simulation job failed) | – | – |"
              fi
            done
            echo
            for size in small medium large; do
              if [ -f "balance/$size.md" ]; then
                cat "balance/$size.md"
                echo
              fi
            done
            echo "Full yearly tables: the \`balance-small\`, \`balance-medium\` and \`balance-large\` artifacts of this run."
          } >> "$GITHUB_STEP_SUMMARY"
