name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect documentation-only change
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.detect.outputs.docs-only }}
    steps:
      # Full history without file contents: the diff only compares trees.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/scripts

      - name: Compare the changed files
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          docs_only="$(bash .github/scripts/docs-only-change.sh "$BASE_SHA" "$HEAD_SHA")"
          echo "Documentation only: $docs_only"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  markdown-quality:
    name: Markdown lint and link check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Collect tracked Markdown files
        id: markdown-files
        run: |
          {
            echo 'files<<EOF'
            git ls-files -- '*.md' '*.markdown'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b # v24.2.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: ${{ steps.markdown-files.outputs.files }}

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --verbose
            --no-progress
            --config .lychee.toml
            ${{ steps.markdown-files.outputs.files }}

  dotnet:
    name: Core build, test and format (plain .NET)
    needs: changes
    # Skipped (which satisfies the required check) only when the change is proved documentation only.
    # If the detection job fails, its output is empty and this job still runs.
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build dotnet/SekoyaTransit.Core.Tests --configuration Release

      - name: Test
        run: dotnet test dotnet/SekoyaTransit.Core.Tests --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format dotnet/SekoyaTransit.Core.Tests --verify-no-changes

      # The balance simulation (ADR 0033) is built and format-checked only; simulations are never run in CI.
      - name: Build balance tool
        run: dotnet build dotnet/SekoyaTransit.Balance --configuration Release

      - name: Verify balance tool formatting
        run: dotnet format dotnet/SekoyaTransit.Balance --verify-no-changes
