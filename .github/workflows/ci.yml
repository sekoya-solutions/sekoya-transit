name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Core build, test and format (plain .NET)
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build dotnet/TransportTycoon.Core.Tests --configuration Release

      - name: Test
        run: dotnet test dotnet/TransportTycoon.Core.Tests --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format dotnet/TransportTycoon.Core.Tests --verify-no-changes
